<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Ghost Pay - Pagamento">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://cdn.jsdelivr.net https://s2.coinmarketcap.com data: blob:; connect-src 'self' https://cdn.jsdelivr.net;">
    <title>Ghost Pay - Pagamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A0A;
            --surface: #111111;
            --surface-2: #1A1A1A;
            --surface-3: #222222;
            --border: #2A2A2A;
            --text: #FFFFFF;
            --text-secondary: #B0B0B0;
            --text-muted: #666666;
            --accent: #FFFFFF;
            --accent-glow: rgba(255, 255, 255, 0.08);
            --success: #00FF88;
            --error: #FF4444;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { width: 0; height: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            line-height: 1.6;
            padding-top: 60px;
        }

        .header-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            background: rgba(10, 10, 10, 0.95);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            display: flex; align-items: center; padding: 0 16px; z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 10px; }

        .brand-icon {
            width: 30px; height: 30px; background: var(--accent); color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; border-radius: var(--radius-sm);
        }

        .brand-name {
            font-family: 'Space Mono', monospace;
            font-size: 15px; font-weight: 700; letter-spacing: -0.5px;
        }

        .content { padding: 20px 16px; padding-bottom: 40px; }

        .section-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-muted); margin-bottom: 12px;
        }

        .receiver-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 16px; margin-bottom: 20px;
        }

        .receiver-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); margin-bottom: 4px;
        }

        .receiver-name { font-size: 16px; font-weight: 600; }

        .amount-display {
            text-align: center; padding: 32px 0; margin-bottom: 20px;
        }

        .amount-value {
            font-family: 'Space Mono', monospace;
            font-size: 48px; font-weight: 700; line-height: 1;
        }

        .amount-currency {
            font-size: 14px; color: var(--text-muted); margin-top: 4px;
        }

        .crypto-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 20px;
        }

        .crypto-btn {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 14px 8px;
            color: var(--text); cursor: pointer; text-align: center;
            transition: all 0.15s; -webkit-tap-highlight-color: transparent;
        }

        .crypto-btn:active { transform: scale(0.96); }

        .crypto-btn.active {
            border-color: var(--accent); background: var(--accent-glow);
        }

        .crypto-icon {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 6px; height: 32px;
        }

        .crypto-icon img { border-radius: 50%; }

        .crypto-name { font-size: 11px; font-weight: 600; }

        .crypto-more { border-style: dashed; }

        .total-section {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .total-label { font-size: 14px; color: var(--text-secondary); }

        .total-value {
            font-family: 'Space Mono', monospace;
            font-size: 20px; font-weight: 700;
        }

        .pay-btn {
            width: 100%; background: var(--accent); color: #000;
            border: none; border-radius: var(--radius-md);
            padding: 16px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 12px;
        }

        .pay-btn:active { transform: scale(0.98); opacity: 0.9; }
        .pay-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .error-box {
            display: none; background: rgba(255,68,68,0.1);
            border: 1px solid rgba(255,68,68,0.3); border-radius: var(--radius-md);
            padding: 12px 16px; margin-bottom: 12px;
            font-size: 13px; color: var(--error);
        }

        .qr-section {
            display: none; text-align: center;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 24px 16px; margin-top: 16px;
        }

        .qr-hint { font-size: 12px; color: var(--text-muted); margin-top: 12px; }

        .copy-link {
            display: flex; align-items: center; gap: 8px;
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px 16px;
            margin-top: 12px; cursor: pointer;
        }

        .copy-link span {
            flex: 1; font-family: 'Space Mono', monospace;
            font-size: 11px; color: var(--text-secondary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .security-note {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--text-muted);
            text-align: center; justify-content: center;
            margin-top: 24px; padding: 0 16px;
        }

        .security-note svg { width: 16px; height: 16px; flex-shrink: 0; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.8); z-index: 200;
            align-items: flex-end; justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-sheet {
            background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            width: 100%; max-width: 480px; max-height: 80vh;
            display: flex; flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 20px 12px;
        }

        .modal-title { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; }

        .modal-close {
            background: none; border: none; color: var(--text-muted);
            font-size: 24px; cursor: pointer; padding: 4px 8px;
        }

        .modal-body { padding: 0 20px 20px; overflow-y: auto; }

        .coin-search {
            padding: 0 20px 12px;
        }

        .coin-search input {
            width: 100%; background: var(--surface-2); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px 16px;
            color: var(--text); font-size: 14px; outline: none;
        }

        .coin-search input:focus { border-color: var(--text-muted); }
        .coin-search input::placeholder { color: var(--text-muted); }

        .coin-list { overflow-y: auto; padding: 0 12px 12px; }

        .coin-list-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border-radius: var(--radius-md);
            cursor: pointer; transition: background 0.15s;
        }

        .coin-list-item:active { background: var(--surface-2); }
        .coin-list-item.selected { background: var(--accent-glow); }

        .coin-list-icon {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; overflow: hidden;
        }

        .coin-list-info { flex: 1; }
        .coin-list-name { font-size: 14px; font-weight: 600; }
        .coin-list-symbol { font-size: 12px; color: var(--text-muted); }

        .coin-list-check {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid var(--border);
        }

        .coin-list-item.selected .coin-list-check {
            background: var(--accent); border-color: var(--accent);
        }

        .toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px 20px;
            font-size: 13px; z-index: 300; transition: bottom 0.3s;
            max-width: 90vw; text-align: center;
        }

        .toast.show { bottom: 24px; }
        .toast.error { border-color: var(--error); color: var(--error); }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.info { border-color: var(--accent); color: var(--text); }

        .qr-address {
            font-family: 'Space Mono', monospace; font-size: 11px;
            color: var(--text-muted); word-break: break-all;
            margin: 8px 0; padding: 8px; background: var(--surface-2);
            border-radius: var(--radius-sm);
        }

        .modal-actions { display: flex; gap: 10px; margin-top: 12px; }

        .modal-btn {
            flex: 1; background: var(--surface-2); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px;
            color: var(--text); font-size: 13px; font-weight: 600;
            cursor: pointer; text-align: center;
        }

        .modal-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }

        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
            margin-top: 12px;
        }

        .status-badge.pending { background: rgba(255,170,0,0.1); color: var(--text-secondary); }
        .status-badge.confirmed { background: rgba(0,255,136,0.1); color: var(--success); }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
        }

        .status-badge.pending .status-dot { background: var(--text-muted); }
        .status-badge.confirmed .status-dot { background: var(--success); }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="brand">
            <div class="brand-icon">GP</div>
            <div class="brand-name">GHOST PAY</div>
        </div>
    </div>

    <div class="content">
        <div class="receiver-card" id="receiverCard" style="display: none;">
            <div class="receiver-label">Pagar a</div>
            <div class="receiver-name" id="receiverName"></div>
        </div>

        <div class="amount-display">
            <div class="amount-value" id="amountDisplay">$0.00</div>
            <div class="amount-currency" id="amountCurrency">USD</div>
        </div>

        <div class="section-title">Selecionar Moeda</div>
        <div class="crypto-grid" id="cryptoGrid">
            <button class="crypto-btn active" data-chain="bitcoin">
                <div class="crypto-icon"><img src="https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/btc.svg" width="28" height="28" alt="BTC"></div>
                <div class="crypto-name">Bitcoin</div>
            </button>
            <button class="crypto-btn" data-chain="ethereum">
                <div class="crypto-icon"><img src="https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/eth.svg" width="28" height="28" alt="ETH"></div>
                <div class="crypto-name">Ethereum</div>
            </button>
            <button class="crypto-btn" data-chain="solana">
                <div class="crypto-icon"><img src="https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/sol.svg" width="28" height="28" alt="SOL"></div>
                <div class="crypto-name">Solana</div>
            </button>
            <button class="crypto-btn" data-chain="polygon">
                <div class="crypto-icon"><img src="https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/matic.svg" width="28" height="28" alt="MATIC"></div>
                <div class="crypto-name">Polygon</div>
            </button>
            <button class="crypto-btn" data-chain="bsc">
                <div class="crypto-icon"><img src="https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/bnb.svg" width="28" height="28" alt="BNB"></div>
                <div class="crypto-name">BSC</div>
            </button>
            <button class="crypto-btn crypto-more" id="moreCryptoBtn">
                <div class="crypto-icon">+</div>
                <div class="crypto-name">More</div>
            </button>
        </div>

        <div class="total-section">
            <span class="total-label">Total</span>
            <span class="total-value" id="totalDisplay">$0.00</span>
        </div>

        <button class="pay-btn" id="payBtn" disabled>Pagar Agora</button>
        <div class="error-box" id="errorBox"></div>

        <div class="qr-section" id="qrSection">
            <div id="qrContainer"></div>
            <div class="qr-hint">Escaneia com Ghost Wallet</div>
            <div class="qr-address" id="qrAddress"></div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="copyAddress()">Copiar Endereco</button>
                <button class="modal-btn primary" onclick="copyLink()">Copiar Link</button>
            </div>
            <div class="status-badge pending" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Aguardando pagamento</span>
            </div>
        </div>

        <div class="security-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Pagamento encriptado e seguro via mesh network
        </div>
    </div>

    <!-- Coin Modal -->
    <div class="modal-overlay" id="coinModal" onclick="if(event.target===this)closeCoinModal()">
        <div class="modal-sheet">
            <div class="modal-header">
                <div class="modal-title">Selecionar Moeda</div>
                <button class="modal-close" onclick="closeCoinModal()">&times;</button>
            </div>
            <div class="coin-search">
                <input type="text" id="coinSearchInput" placeholder="Pesquisar moeda..." oninput="filterCoins()">
            </div>
            <div class="coin-list" id="coinList"></div>
        </div>
    </div>

    <!-- QR Modal (for payment confirmation) -->
    <div class="modal-overlay" id="qrModal" onclick="if(event.target===this)closeQRModal()">
        <div class="modal-sheet">
            <div class="modal-header">
                <div class="modal-title">Pagar com Criptomoeda</div>
                <button class="modal-close" onclick="closeQRModal()">&times;</button>
            </div>
            <div class="modal-body" style="text-align: center;">
                <div id="qrModalContainer"></div>
                <div class="qr-address" id="qrModalAddress" style="margin: 12px 0;"></div>
                <div class="modal-actions">
                    <button class="modal-btn" onclick="copyAddress()">Copiar Endereco</button>
                    <button class="modal-btn primary" onclick="copyLink()">Copiar Link</button>
                </div>
                <div class="status-badge pending" id="qrModalStatus" style="margin-top: 12px;">
                    <span class="status-dot"></span>
                    <span id="qrModalStatusText">Aguardando pagamento</span>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="/components/ghost-qrcode.js"></script>
    <script src="/sdk/ghostpay-sdk.js?v=2"></script>
    <script>
        const SDK = window.GhostPaySDK;

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const paramReceiver = urlParams.get('receiver');
        const paramAmount = urlParams.get('amount');
        const paramCurrency = urlParams.get('currency');
        const paramChain = urlParams.get('chain');
        const paramAddress = urlParams.get('address');
        const paramTimestamp = urlParams.get('timestamp');
        const paramTTL = urlParams.get('ttl');
        const paramSig = urlParams.get('sig');
        const paramApiKey = urlParams.get('apiKey');

        // Link expiration
        if (paramTimestamp) {
            const age = Date.now() - parseInt(paramTimestamp, 10);
            if (age > parseInt(paramTTL || '300000', 10)) {
                document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;background:#000;padding:2rem;text-align:center;"><div><h1 style="font-size:1.5rem;margin-bottom:1rem;">Link expirado</h1><p style="color:#999;">Este link de pagamento expirou.</p></div></div>';
                throw new Error('Expired');
            }
        }

        // HMAC verification
        if (paramSig) {
            const vk = urlParams.get('key');
            if (vk) {
                try {
                    const vp = new URLSearchParams(window.location.search);
                    vp.delete('sig'); vp.delete('key');
                    const enc = new TextEncoder();
                    const key = await crypto.subtle.importKey('raw', enc.encode(vk), {name:'HMAC',hash:'SHA-256'}, false, ['verify']);
                    const sigBytes = hexToBytes(paramSig);
                    const valid = await crypto.subtle.verify('HMAC', key, sigBytes, enc.encode(vp.toString()));
                    if (!valid) {
                        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;background:#000;padding:2rem;text-align:center;"><div><h1 style="font-size:1.5rem;margin-bottom:1rem;">Link adulterado</h1><p style="color:#FF4444;">Assinatura invalida. Link modificado.</p></div></div>';
                        throw new Error('Invalid HMAC');
                    }
                } catch (e) { if (e.message === 'Invalid HMAC') throw e; }
            }
        }

        if (!paramReceiver || !paramAmount) {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;background:#000;padding:2rem;text-align:center;"><div><h1 style="font-size:1.5rem;margin-bottom:1rem;">Link invalido</h1><p style="color:#999;">Parametros receiver e amount sao obrigatorios.</p></div></div>';
            throw new Error('Missing params');
        }

        function hexToBytes(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
            return bytes;
        }

        const chainNames = { bitcoin:'Bitcoin', ethereum:'Ethereum', solana:'Solana', polygon:'Polygon', bsc:'BSC' };
        const amount = parseFloat(paramAmount) || 0;
        const currency = paramCurrency || 'USD';
        let selectedChain = paramChain || 'bitcoin';
        let receiverAddress = paramAddress || '';
        let paymentLink = '';

        // Init
        document.getElementById('receiverName').textContent = paramReceiver;
        document.getElementById('receiverCard').style.display = 'block';
        document.getElementById('amountDisplay').textContent = `$${amount.toFixed(2)}`;
        document.getElementById('amountCurrency').textContent = currency;
        document.getElementById('totalDisplay').textContent = `$${amount.toFixed(2)}`;

        // Set initial chain
        document.querySelectorAll('.crypto-btn').forEach(b => {
            b.classList.remove('active');
            if (b.dataset.chain === selectedChain) b.classList.add('active');
        });

        updateBtn();

        function updateBtn() {
            const btn = document.getElementById('payBtn');
            btn.disabled = amount <= 0 || !receiverAddress;
        }

        // Crypto selection
        document.querySelectorAll('.crypto-btn:not(.crypto-more)').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.crypto-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedChain = btn.dataset.chain;
            };
        });

        // More crypto button
        document.getElementById('moreCryptoBtn').addEventListener('click', openCoinModal);

        // Pay button
        document.getElementById('payBtn').onclick = () => {
            if (amount <= 0 || !receiverAddress) return;
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.textContent = 'Gerando...';

            try {
                const checkout = SDK.Checkout.fromJSON({
                    receiver: { name: paramReceiver },
                    mode: 'fixed',
                    plans: [{ id: 'fixed', name: 'Pagamento', price: amount, currency: currency, selected: true }],
                    supportedChains: ['bitcoin','ethereum','solana','polygon','bsc'],
                });
                checkout.selectChain(selectedChain);
                const data = checkout.buildCheckoutData(receiverAddress);

                const ts = Date.now();
                const qrData = `ghostpay:payment?receiver=${encodeURIComponent(data.receiver.name)}&amount=${data.amount}&currency=${data.currency}&chain=${data.chain}&address=${encodeURIComponent(data.address)}&nonce=${data.nonce}&timestamp=${ts}&ttl=300000`;
                paymentLink = data.paymentLink;

                const qrSection = document.getElementById('qrSection');
                qrSection.style.display = 'block';
                document.getElementById('qrAddress').textContent = receiverAddress;

                const container = document.getElementById('qrContainer');
                container.innerHTML = '';
                QRCode.toCanvas(qrData, { width: 180, margin: 2, color: { dark: '#000000', light: '#FFFFFF' } }, (err, canvas) => {
                    if (!err && canvas) { canvas.style.borderRadius = '12px'; container.appendChild(canvas); }
                });

                // Also show QR modal
                showQRModal(qrData);

            } catch (e) {
                console.error(e);
                showError('Erro ao gerar pagamento.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Pagar Agora';
                updateBtn();
            }
        };

        function showQRModal(qrData) {
            const modal = document.getElementById('qrModal');
            modal.classList.add('active');
            document.getElementById('qrModalAddress').textContent = receiverAddress;

            const container = document.getElementById('qrModalContainer');
            container.innerHTML = '';
            QRCode.toCanvas(qrData, { width: 200, margin: 2, color: { dark: '#000000', light: '#FFFFFF' } }, (err, canvas) => {
                if (!err && canvas) { canvas.style.borderRadius = '12px'; container.appendChild(canvas); }
            });
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('active');
        }

        function showError(msg) {
            const el = document.getElementById('errorBox');
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function copyAddress() {
            if (!receiverAddress) return;
            try { await navigator.clipboard.writeText(receiverAddress); showToast('Endereco copiado!'); }
            catch { showToast('Erro ao copiar', 'error'); }
        }

        async function copyLink() {
            if (!paymentLink) return;
            try { await navigator.clipboard.writeText(paymentLink); showToast('Link copiado!'); }
            catch { showToast('Erro ao copiar', 'error'); }
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ========= COIN MODAL =========
        const MORE_COINS = [
            { chain: 'avalanche', name: 'Avalanche', symbol: 'AVAX', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/avax.svg' },
            { chain: 'cardano', name: 'Cardano', symbol: 'ADA', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/ada.svg' },
            { chain: 'polkadot', name: 'Polkadot', symbol: 'DOT', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/dot.svg' },
            { chain: 'dogecoin', name: 'Dogecoin', symbol: 'DOGE', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/doge.svg' },
            { chain: 'tron', name: 'Tron', symbol: 'TRX', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/trx.svg' },
            { chain: 'cosmos', name: 'Cosmos', symbol: 'ATOM', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/atom.svg' },
            { chain: 'litecoin', name: 'Litecoin', symbol: 'LTC', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/ltc.svg' },
            { chain: 'fantom', name: 'Fantom', symbol: 'FTM', icon: 'https://s2.coinmarketcap.com/static/img/coins/64x64/3513.png' },
            { chain: 'algorand', name: 'Algorand', symbol: 'ALGO', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/algo.svg' },
            { chain: 'stellar', name: 'Stellar', symbol: 'XLM', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/xlm.svg' },
            { chain: 'monero', name: 'Monero', symbol: 'XMR', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/xmr.svg' },
            { chain: 'dash', name: 'Dash', symbol: 'DASH', icon: 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/dash.svg' },
        ];

        function openCoinModal() {
            document.getElementById('coinModal').classList.add('active');
            renderCoinList('');
            document.getElementById('coinSearchInput').value = '';
            document.getElementById('coinSearchInput').focus();
        }

        function closeCoinModal() {
            document.getElementById('coinModal').classList.remove('active');
        }

        function filterCoins() {
            renderCoinList(document.getElementById('coinSearchInput').value.toLowerCase());
        }

        function renderCoinList(query) {
            const list = document.getElementById('coinList');
            const coins = query ? MORE_COINS.filter(c => c.name.toLowerCase().includes(query) || c.symbol.toLowerCase().includes(query)) : MORE_COINS;
            list.innerHTML = coins.map(c => `
                <div class="coin-list-item ${selectedChain === c.chain ? 'selected' : ''}" onclick="selectMoreCoin('${c.chain}')">
                    <div class="coin-list-icon"><img src="${c.icon}" width="32" height="32" alt="${c.symbol}"></div>
                    <div class="coin-list-info">
                        <div class="coin-list-name">${c.name}</div>
                        <div class="coin-list-symbol">${c.symbol}</div>
                    </div>
                    <div class="coin-list-check"></div>
                </div>
            `).join('');
        }

        function selectMoreCoin(chain) {
            const coin = MORE_COINS.find(c => c.chain === chain);
            if (!coin) return;
            selectedChain = chain;
            const grid = document.getElementById('cryptoGrid');
            grid.querySelectorAll('.crypto-btn').forEach(b => b.classList.remove('active'));
            const existing = grid.querySelector(`[data-chain="${chain}"]`);
            if (existing) {
                existing.classList.add('active');
            } else {
                const moreBtn = grid.querySelector('.crypto-more');
                const newBtn = document.createElement('button');
                newBtn.className = 'crypto-btn active';
                newBtn.setAttribute('data-chain', chain);
                newBtn.innerHTML = '<div class="crypto-icon"><img src="' + coin.icon + '" width="28" height="28" alt="' + coin.symbol + '"></div><div class="crypto-name">' + coin.symbol + '</div>';
                newBtn.onclick = () => {
                    grid.querySelectorAll('.crypto-btn').forEach(b => b.classList.remove('active'));
                    newBtn.classList.add('active');
                    selectedChain = chain;
                };
                grid.insertBefore(newBtn, moreBtn);
            }
            closeCoinModal();
            showToast(coin.name + ' selecionado');
        }
    </script>
</body>
</html>
